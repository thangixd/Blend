name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gt-plans:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      # Operator.DB = DBHandler() runs at import time and reads config/config.ini,
      # so the config has to resolve before any test imports an operator. The
      # committed config points at the root index, which CI does not build.
      - name: Point the runtime config at the test index
        run: cp tests/tasks/adventure_works.ini config/config.ini

      - name: Build the index
        run: >
          uv run python -m scripts.create_index_duckdb
          --lake adventure_works
          --datalake tests/tasks/datalake
          --db tests/test_duckdb.db

      # Runs without the nl extra, which keeps the seekers importable without it.
      - name: Run unit tests
        run: |
          uv run python tests/test_ml_optimizer.py
          uv run python tests/test_predicate.py
          uv run python tests/test_nl_seeker.py

      - name: Run NL unit tests
        run: |
          uv sync --extra nl
          uv run python tests/test_nl_summarizer.py
          uv run python tests/test_nl_index_generator.py

      # The case list comes from the test file so the two cannot drift apart.
      # Each case runs in its own log group and a failure does not stop the rest.
      - name: Run plan tests
        run: |
          mapfile -t cases < <(uv run python tests/test_gt_plans.py --list)
          echo "running ${#cases[@]} cases"

          failed=()
          for case in "${cases[@]}"; do
            echo "::group::$case"
            uv run python tests/test_gt_plans.py "$case" || failed+=("$case")
            echo "::endgroup::"
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::${#failed[@]} of ${#cases[@]} cases failed: ${failed[*]}"
            exit 1
          fi
          echo "all ${#cases[@]} cases match the report"
