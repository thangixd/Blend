services:
  blend:
    build: .
    image: blend:latest
    container_name: blend
    network_mode: host
    working_dir: /app

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    volumes:
      - ./benchmark-data:/app/benchmark-data
      - ./EvaluationDataFromPneuma:/app/EvaluationDataFromPneuma:ro
      - ./Makefile:/app/Makefile:ro
      # Persist the HuggingFace cache so bge-base (~440 MB) doesn't
      # re-download on every `up --build`.
      - hf-cache:/root/.cache/huggingface

    environment:
      PYTHONHASHSEED: "0"
      # Pin the embedder to a single idle A100; do not race vLLM for VRAM.
      CUDA_VISIBLE_DEVICES: "1"

    command: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

volumes:
  hf-cache:
