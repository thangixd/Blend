[project]
name = "blend"
version = "0.1.0"
description = "Blend: A Unified Data Discovery System"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Blend core
    "pandas",
    "numpy",
    "duckdb>=1.1.3",
    "tqdm",
    "pyarrow",
    "psycopg[binary]",
    "vertica-python",

    # NLSeeker
    "bm25s==0.1.10",
    "chroma-hnswlib==0.7.6",
    "chromadb-deterministic==0.5.5.post6",
    "sentence-transformers>=3.4.1",
    "transformers>=4.48.3",
    "torch>=2.5.1,<2.9",
    "accelerate>=1.3.0",
    "openai>=1.63.2",
    "tiktoken>=0.9.0",
    "PyStemmer>=2.2.0.3",
    "huggingface-hub",
    "fire",
]

[tool.uv]
python-preference = "managed"
[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "jsonschema",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_vllm: integration test that needs the vLLM containers running on :8001 and :8002",
]
filterwarnings = [
    "ignore:Accessing the 'model_fields' attribute on the instance is deprecated:DeprecationWarning",
    "ignore:.*pydantic.*:DeprecationWarning",
]
log_cli = false
