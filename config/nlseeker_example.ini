[NLSeeker]
out_path             = nl-out
index_name           = blend_nl_index

; false: OpenAI-compatible HTTP backend (openai_* below).
; true:  in-process HuggingFace backend (llm_path / embed_path below).
use_local_model      = true

; openai_* = OpenAI wire protocol
openai_api_key       =
openai_base_url      =
openai_llm_model     = gpt-4o-mini
openai_embed_model   = text-embedding-3-small

llm_path             = Qwen/Qwen2.5-7B-Instruct
embed_path           = BAAI/bge-base-en-v1.5
hf_token             =

alpha                = 0.5
n                    = 5
default_k            = 10
max_llm_batch_size   = 50
