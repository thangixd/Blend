[Database]
dbms=duckdb
path=blend.duckdb
index_table=blend_index

[NLSeeker]
out_path             = nl-out
index_name           = blend_nl_index

; false: OpenAI-compatible HTTP backend (openai_* below).
; true:  in-process HuggingFace backend (llm_path / embed_path below).
use_local_model      = false

; openai_* = OpenAI wire protocol, not necessarily OpenAI itself.
openai_api_key       =
openai_base_url      = http://localhost:11434/v1
openai_llm_model     = qwen:72b
openai_embed_model   = mxbai-embed-large

llm_path             = Qwen/Qwen2.5-7B-Instruct
embed_path           = BAAI/bge-base-en-v1.5
hf_token             =

alpha                = 0.5
n                    = 5
default_k            = 10
max_llm_batch_size   = 50
